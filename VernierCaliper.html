<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Angkup Vernier</title>
    <style>
        /* Gaya Am Halaman */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f1eb; /* Warna latar belakang lembut */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Bekas Utama Halaman */
        .main-wrapper {
            background-color: #ffffff;
            border: 2px solid #333333;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 40px;
            box-sizing: border-box;
        }

        /* Style untuk Butang Home */
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }

        .btn-home:hover {
            background-color: #1d4ed8;
        }

        /* Tajuk Utama */
        h1.main-title {
            text-transform: uppercase;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 25px;
            color: #000;
        }

        /* Bahagian Imej Angkup */
        .caliper-image-section {
            width: 100%;
            text-align: center;
            margin-bottom: 30px;
        }

        .caliper-image-section img {
            max-width: 100%;
            height: auto;
        }

        /* Susun atur Grid untuk Data Input dan Nota */
        .info-grid {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        /* Gaya Kotak Kotak (Data, Nota, Keputusan) */
        .content-box {
            border: 2px solid #333333;
            background-color: #fff;
            box-sizing: border-box;
        }

        .box-header {
            font-weight: bold;
            background-color: #ffffff;
            border-bottom: 2px solid #333333;
            padding: 8px 15px;
            text-transform: uppercase;
            font-size: 14px;
        }

        .box-content {
            padding: 10px 0;
        }

        /* Gaya Baris Input */
        .input-row {
            display: grid;
            grid-template-columns: 1fr auto 90px auto; /* Label, Sama Dengan, Input, Unit */
            align-items: center;
            padding: 5px 15px;
            gap: 10px;
        }

        .label-text {
            font-size: 13px;
            color: #000;
        }

        .label-text strong {
            color: #000;
        }

        .formula-note {
            font-style: italic;
            color: #666;
            font-size: 12px;
        }

        .equals-sign {
            font-weight: bold;
            color: #333;
            text-align: center;
        }

        /* Medan Input Kuning */
        .data-input {
            width: 100%;
            border: 1px solid #999;
            background-color: #ffff00; /* Warna kuning input rujukan */
            padding: 4px;
            font-size: 13px;
            text-align: center;
            box-sizing: border-box;
            border-radius: 2px;
        }

        .unit-text {
            font-size: 13px;
            color: #000;
            width: 25px;
            text-align: left;
        }

        /* Bahagian Nota */
        .note-box .box-content {
            padding: 10px 15px 15px 15px;
            font-size: 12px;
            line-height: 1.5;
            color: #000;
        }

        .note-box ol {
            margin: 0;
            padding-left: 18px;
        }

        .note-box li {
            margin-bottom: 5px;
        }

        /* Bahagian Keputusan */
        .final-result-section {
            border: 2px solid #333333;
        }

        .final-result-section .box-content {
            padding: 10px 0;
        }

        .result-row {
            grid-template-columns: 1fr auto 110px auto;
        }

        .result-output {
            background-color: #f0f0f0;
            font-weight: bold;
            color: #333;
            border: 1px solid #ccc;
        }

        /* Penunjuk Pengaki */
        .footer-guide {
            margin-top: 30px;
            font-style: italic;
            font-size: 13px;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .color-legend {
            width: 35px;
            height: 18px;
            background-color: #ffff00;
            border: 1px solid #999;
            margin-left: 10px;
            border-radius: 2px;
        }

        /* Responsif Skrin Telefon */
        @media (max-width: 768px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>
